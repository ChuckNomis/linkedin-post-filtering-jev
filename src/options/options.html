<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LinkedIn Post Filter Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main class="container">
    <header class="app-header">
      <div class="logo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12l2 2 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/>
        </svg>
      </div>
      <div>
        <h1>Post Filter</h1>
        <p class="subtitle">Jev-powered job matching for LinkedIn</p>
      </div>
    </header>

    <form id="settings-form">
      <section class="card">
        <h2 class="card-title">Connection</h2>
        <label for="apiKey">Jev API Key</label>
        <div class="input-with-action">
          <input type="password" id="apiKey" name="apiKey" placeholder="sk-..." autocomplete="off" />
          <button type="button" id="toggleKeyVisibility" class="icon-button" aria-label="Show API key">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </button>
        </div>
        <p class="hint">
          Get a key from
          <a href="https://console.typesafe.ai/keys" target="_blank" rel="noopener">console.typesafe.ai</a>.
          Stored only on this device.
        </p>
      </section>

      <section class="card">
        <h2 class="card-title">Job Search Criteria</h2>

        <label for="targetRoles">Target Roles</label>
        <input
          type="text"
          id="targetRoles"
          name="targetRoles"
          placeholder="Backend Engineer, AI Developer, Product Manager"
        />
        <p class="hint">Comma-separated list of roles you're looking for.</p>

        <label class="levels-label">Target Levels</label>
        <div class="chip-group" id="targetLevels">
          <button type="button" class="chip" data-value="Junior">Junior</button>
          <button type="button" class="chip" data-value="Mid">Mid</button>
          <button type="button" class="chip" data-value="Senior">Senior</button>
          <button type="button" class="chip" data-value="Director">Director</button>
          <button type="button" class="chip" data-value="Management">Management</button>
        </div>
      </section>

      <button type="submit" class="save-button">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 6 9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Save Settings
      </button>
      <p id="status" class="status" role="status"></p>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
